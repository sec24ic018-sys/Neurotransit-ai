# Mosquitto MQTT Broker Configuration
# This is a configuration file for mosquitto MQTT broker
# For local development and testing

# Listener configuration
listener 1883
protocol mqtt

# Listener for WebSocket connections
listener 9001
protocol websockets

# Allow anonymous connections (for development only)
allow_anonymous true

# Set the client ID format
clientid_prefix traffic_sensor_

# Persistence configuration
persistence true
persistence_location /var/lib/mosquitto/

# Logging configuration
log_dest file /var/log/mosquitto/mosquitto.log
log_dest stdout
log_type all

# Topic ACL (Access Control List)
# By default, all clients can publish and subscribe to all topics
acl_file /etc/mosquitto/aclfile

# For local development without authentication:
# Remove or comment out the acl_file line above
