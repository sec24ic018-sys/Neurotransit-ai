services:
  backend:
    build: ../backend
    working_dir: /app
    command: npm start
    ports:
      - "5000:5000"
    env_file:
      - ../backend/.env
  frontend:
    build: ../frontend
    working_dir: /app
    command: npm start
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api